<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cell Lab</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 1</span><span class="iso-plate-corner" data-corner="title">Cell Lab — bio-reactor rig</span><span class="iso-plate-corner" data-corner="hint">Press an action (standalone) or use the game dock</span><span class="iso-plate-corner" data-corner="readout" data-readout>Ready — press an action</span></div><div class="iso-stage stage-shell embed" tabindex="0" role="group" aria-label="Cell Lab actions"><style>
.iso{--mit:#f8aa06;--ink:#161412}
.tk-pellet{fill:#f8aa06;stroke:#161412;stroke-width:.6}
.tk-gluc{fill:#fff;stroke:#161412;stroke-width:.6}
.tk-atp{fill:#f8aa06;stroke:#161412;stroke-width:.7}
.tk-txt{font:700 3px var(--anatomy-mono);fill:#161412}
.tk-dot{fill:#161412}
.tk-spore{fill:#26262a;stroke:#fbfbfa;stroke-width:.5}
.tk-enz{fill:#f8aa06;stroke:#161412;stroke-width:.6}
.tk-debris{fill:#8a8a8f;stroke:#161412;stroke-width:.6}
.vial-fill{fill:var(--mit)}
.vial-fill .iso-fill{fill:var(--mit)}
.vial-fill .iso-shade{fill:#d49005}
.vial-fill .iso-top{fill:#ffb832}
.vial-fill .iso-edge{stroke:#161412}
.mito-body.is-active{outline:none}
.is-active{filter:drop-shadow(0 0 3px #f8aa06)}
.is-active .iso-edge{stroke:#f8aa06!important;stroke-width:1.6}
.lamp-err .iso-edge{stroke:#e5484d!important}
.status-dim{opacity:.55}
.status-grey{filter:grayscale(1);opacity:.6}
.frost-on .iso-edge{stroke:#8ac6e8!important}
.stage-shell{position:relative}
.dock{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 4px}
.dock button{font:600 11px/1 ui-sans-serif,system-ui;letter-spacing:.03em;padding:7px 10px;border-radius:999px;border:1.5px solid #161412;background:#fbfbfa;color:#161412;cursor:pointer}
.dock button[data-state="armed"]{background:#f8aa06}
.counters{display:flex;gap:14px;justify-content:center;color:var(--anatomy-strong);font:600 12px var(--anatomy-mono);margin:6px 0 2px}
.embed .dock,.embed .counters{display:none}
.embed .iso-plate{padding:8px;border-radius:0;box-shadow:none}
.embed .iso-legend{display:none}
.embed .iso-plate-corners{display:none}
.credit{position:absolute;right:6px;bottom:2px;font:500 9px var(--anatomy-mono);color:var(--anatomy-muted)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;


const P = {"origin":[410,242.35119931773158],"scale":1.6790926863661584,"azimuth":45,"elevation":30};
const DIAL = [105,-32];
const DIAL_TOP = 19;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const tokenEls = {};
svg.querySelectorAll("[data-token]").forEach(el => tokenEls[el.dataset.token] = el);
const $ = (s) => svg.querySelector(s);
const markers = {
  feed: () => iso([-20,-8,16], P),
  mito: () => iso([-23,10,30], P),
  dial: () => iso([DIAL[0], DIAL[1], DIAL_TOP+1.5], P),
  extractor: () => iso([80,-5,26], P),
  press: () => iso([105,-5,30], P),
  synth: () => iso([130,-5,22], P),
  crate: () => iso([145,5,12], P),
  nucleus: () => iso([-78,2,33], P),
  lysosome: () => iso([-56,22,30], P),
  dock: () => iso([-150,-50,14], P),
};
const HOME = () => markers.dial();
function place(name, pt){ const el = tokenEls[name]; if(!el) return; const [x,y] = pt; el.setAttribute("transform", "translate("+x+" "+y+")"); }
function show(name, on){ const el = tokenEls[name]; if(!el) return; el.setAttribute("opacity", on ? "1" : "0"); }
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EMBED = /[?&]embed=1/.test(location.search);
const ORIGIN = location.origin;
const params = new URLSearchParams(location.search);
const readout = document.querySelector("[data-readout]");
const atpEl = document.querySelector("[data-counter-atp]");
const vitEl = document.querySelector("[data-counter-vit]");
const ACTIONS = ["feed","atp","extract","transmute","synthesize","nucleus","lysosome","divide","lysis","splice"];
const labelOf = { feed:["Feed","nutrient pellets via chute"], atp:["ATP","glucose in, ATP tokens out"], extract:["Extract","spore granules"], transmute:["Transmute","press to capsule"], synthesize:["Synthesize","elixir vial filled and capped"], nucleus:["Nucleus","mRNA to ribosomes"], lysosome:["Lysosome","digesting debris"], divide:["Divide","mitosis pinch"], lysis:["Lysis","membrane ruptured"], splice:["Splice","second cell docks and fuses"] };
let S = { status:"Active", vitality:70, atp:0, organel:{mitokondria:2, nukleus:2, lisosom:2}, zone:"Normal" };
let needleTurn = 0.25, busy = false, phase = "";
function setReadout(txt){ if(readout && readout.textContent !== txt) readout.textContent = txt; }
function setCounters(){ if(atpEl) atpEl.textContent = "ATP " + S.atp; if(vitEl) vitEl.textContent = "Vitality " + Math.round(S.vitality); }
function needleAt(turn){
  const a = turn * Math.PI * 2;
  return lineOnTop(
    [DIAL[0] - Math.sin(a)*3.2, DIAL[1] + Math.cos(a)*3.2],
    [DIAL[0] + Math.sin(a)*(17-4.5), DIAL[1] - Math.cos(a)*(17-4.5)],
    DIAL_TOP + 0.2, P, false
  );
}
function drawNeedle(){ const n = $('[data-part="needle"]'); if(n) n.setAttribute("d", needleAt(Math.min(0.9, Math.max(0.05, needleTurn)))); }
function hl(selector, on){ const el = $(selector); if(!el) return; el.classList.toggle("is-active", on); }
function highlight(action, on){
  const map = { feed:'[data-part="feed-chute"]', atp:'.mito-body', extract:'[data-part="extractor"]', transmute:'[data-part="press-head"]', synthesize:'[data-part="vial-fill"]', nucleus:'[data-part="mrna"]', lysosome:'.lyso', divide:'[data-part="cell-lobe-b"]', lysis:'.mito-body', splice:'.dock-cell' };
  // feed marker: pituitary none -> use mito? feed highlights chute via token anyway; use dial cover none
  const sel = { feed:null, atp:'.mito-body', extract:null, transmute:'[data-part="press-head"]', synthesize:'[data-part="vial-fill"]', nucleus:'.mito-body', lysosome:null, divide:'[data-part="cell-lobe-b"]', lysis:'.mito-body', splice:'.dock-cell' }[action];
  if(sel) hl(sel, on);
  // light the relevant station groups
  const station = { feed:null, atp:null, extract:null, transmute:null, synthesize:null, nucleus:null, lysosome:null, divide:null, lysis:null, splice:null }[action];
}
function animateMove(name, fromFn, toFn, dur, done){
  if(calm){ place(name, toFn()); show(name, true); done && done(); return; }
  const t0 = performance.now();
  const a = fromFn(), b = toFn();
  place(name, a); show(name, true);
  function step(now){
    const t = Math.min(1, (now - t0)/dur);
    const e = t*t*(3-2*t);
    place(name, [a[0]+(b[0]-a[0])*e, a[1]+(b[1]-a[1])*e - Math.sin(e*Math.PI)*14]);
    if(t < 1) requestAnimationFrame(step); else done && done();
  }
  requestAnimationFrame(step);
}
function pulse(action){
  // synchronous highlight still for reduced motion / mid-frame readability
  highlight(action, true);
}
const seq = [];
function finish(action){
  busy = false; phase = "";
  setReadout(labelOf[action][0] + " done · ATP " + S.atp);
  if(!EMBED) window.parent.postMessage({type:"snacc:done", action}, ORIGIN);
}
function play(action){
  if(busy) return; if(!ACTIONS.includes(action)) return;
  busy = true;
  if(!EMBED) window.parent.postMessage({type:"snacc:action", action}, ORIGIN);
  const D = (f) => f();
  const paths = {
    feed(){ pulse("feed"); animateMove("pellet", markers.feed, () => markers.mito(), calm?1:900, ()=>{ S.vitality = Math.min(100, S.vitality+4); setCounters(); show("pellet", false); highlight("feed", false); finish("feed"); }); },
    atp(){ pulse("atp"); S.atp += 2; setCounters(); needleTurn = Math.min(0.9, needleTurn+0.12); drawNeedle();
      animateMove("glucose", markers.mito, markers.mito, calm?1:500, ()=>{
        ["atp1","atp2","atp3"].forEach((n,i)=> setTimeout(()=> animateMove(n, markers.mito, markers.dial, calm?1:1100 - i*150, ()=> show(n,false)), i*140));
        setTimeout(()=>{ highlight("atp", false); finish("atp"); }, calm?60:1400);
      }); },
    extract(){ pulse("extract"); animateMove("spore", markers.mito, markers.extractor, calm?1:1000, ()=>{ show("spore", false); highlight("extract", false); finish("extract"); }); },
    transmute(){ pulse("transmute"); animateMove("spore", markers.extractor, markers.press, calm?1:900, ()=>{ const head = $('[data-part="press-head"]'); if(head && !calm) head.setAttribute("transform","translate(0 6)"); setTimeout(()=>{ if(head) head.removeAttribute("transform"); animateMove("enzyme", markers.press, markers.synth, calm?1:900, ()=>{ show("enzyme", false); highlight("transmute", false); finish("transmute"); }); }, calm?1:450); }); },
    synthesize(){ pulse("synthesize"); const fill = $('[data-part="vial-fill"]'); const cap = $('.vial-cap'); if(fill) fill.style.transform = calm ? "none" : "scaleY(1)"; if(cap && !calm) cap.setAttribute("transform","translate(0 -3)"); setTimeout(()=>{ if(cap) cap.removeAttribute("transform"); if(fill) fill.style.transform="none"; animateMove("enzyme", markers.synth, markers.crate, calm?1:900, ()=>{ show("enzyme", false); highlight("synthesize", false); finish("synthesize"); }); }, calm?1:900); },
    nucleus(){ pulse("nucleus"); const m = $('[data-part="mrna"]'); if(m) m.setAttribute("opacity","1"); animateMove("spore", markers.nucleus, markers.extractor, calm?1:1300, ()=>{ show("spore", false); if(m) m.setAttribute("opacity","0"); highlight("nucleus", false); finish("nucleus"); }); },
    lysosome(){ pulse("lysosome"); animateMove("debris", markers.dock, markers.lysosome, calm?1:1100, ()=>{ show("debris", false); highlight("lysosome", false); finish("lysosome"); }); },
    divide(){ pulse("divide"); const lobe = $('[data-part="cell-lobe-b"]'); const spin = $('[data-part="spindle"]'); if(lobe) lobe.setAttribute("opacity","1"); if(spin) spin.setAttribute("opacity","1"); setTimeout(()=>{ if(lobe) lobe.setAttribute("opacity","0"); if(spin) spin.setAttribute("opacity","0"); highlight("divide", false); finish("divide"); }, calm?200:1600); },
    lysis(){ pulse("lysis"); S.status = "Liquidated"; applyStatus(); setTimeout(()=>{ highlight("lysis", false); finish("lysis"); }, calm?200:1200); },
    splice(){ pulse("splice"); const dock = $('.dock-cell'); if(dock && !calm) dock.setAttribute("transform","translate(38 6)"); setTimeout(()=>{ if(dock) dock.removeAttribute("transform"); highlight("splice", false); finish("splice"); }, calm?200:1300); },
  };
  setReadout(labelOf[action][0] + " · " + labelOf[action][1] + (busy ? "…" : ""));
  paths[action]();
}
function applyStatus(){
  const st = stage.querySelector("svg");
  st.classList.toggle("status-dim", S.status === "Distressed");
  st.classList.toggle("status-grey", S.status === "SplicedBurned");
  const lamp = $('[data-part="status-lamp"] .iso-edge');
  if(lamp) lamp.setAttribute("data-tone", S.status === "Liquidated" ? "red" : "hi");
  const sl = $('[data-part="status-lamp"]');
  if(sl) sl.classList.toggle("lamp-err", S.status === "Liquidated");
  // organelles 0..5
  const mitoN = [0,1,2,3,4,6][Math.min(5, Math.max(0, S.organel.mitokondria|0))];
  const sats = svg.querySelectorAll(".mito-sat");
  sats.forEach((el,i)=> el.setAttribute("opacity", i < mitoN ? "1" : "0.12"));
  const nucGlow = 0.4 + (Math.min(5, Math.max(0, S.organel.nukleus|0))/5)*0.6;
  const nuc = svg.querySelectorAll(".mito-body");
  // lysosome count visibility via opacity of .lyso cylinders (none marked) -> use satellites trick: second group
  // zone
  const haze = $('[data-part="heat-haze"]');
  if(haze) haze.setAttribute("opacity", S.zone === "Fever" ? "1" : "0");
  st.classList.toggle("frost-on", S.zone === "Hypothermia");
  drawNeedle(); setCounters();
}
window.addEventListener("message", (e) => {
  if(e.origin !== ORIGIN) return;
  const d = e.data; if(!d || typeof d.type !== "string") return;
  if(d.type === "snacc:state"){
    const s = d.strain || {};
    S.status = s.status || S.status;
    S.vitality = (s.effective_vitality ?? s.vitality ?? S.vitality);
    S.atp = (typeof s.atp_balance === "number" ? s.atp_balance : S.atp);
    if(s.organel){ S.organel.mitokondria = s.organel.mitokondria ?? S.organel.mitokondria; S.organel.nukleus = s.organel.nukleus ?? S.organel.nukleus; S.organel.lisosom = s.organel.lisosom ?? S.organel.lisosom; }
    if(d.zone) S.zone = d.zone;
    applyStatus();
  } else if(d.type === "snacc:play"){
    if(ACTIONS.includes(d.action)) play(d.action);
  }
});
document.querySelectorAll("[data-action]").forEach(btn => {
  btn.addEventListener("click", () => { play(btn.dataset.action); });
});
applyStatus();
if(!calm) setReadout("Ready — press an action");
window.parent.postMessage({type:"snacc:ready"}, ORIGIN);
</script></body></html>
